<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="690" viewBox="0 0 1360 690" role="img" aria-labelledby="title desc">
<title id="title">内部 AI 数据库运维平台功能设计图</title><desc id="desc">从资产接入到持续采集、事件、AI证据关联、人工处置、复验和知识留存的闭环。贯穿部门系统实例授权、审计和数据策略。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#368d85"/></marker><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#173b3b}.h{font-size:19px;font-weight:700}.b{font-size:15px;fill:#4e686a}.s{font-size:13px;fill:#4e686a}.n{fill:#fff;stroke:#bcd8d3;stroke-width:1.5}.a{fill:none;stroke:#368d85;stroke-width:2;marker-end:url(#arrow)}.tag{fill:#e1f3ef}</style></defs>
<rect width="1360" height="690" rx="20" fill="#f3f8f7"/><text x="35" y="43" class="h">系统功能地图</text><text x="35" y="71" class="b">对象是持续运行的内部运维平台；故障实验用来验证流程。以下均为设计。</text>
<rect x="35" y="99" width="1290" height="64" rx="12" class="tag"/><text x="60" y="128" class="h">贯穿所有页面与 API 的治理</text><text x="60" y="151" class="b">身份和会话 · 部门 / 系统 / 实例范围 · 字段可见级别 · 凭据隔离 · AI 数据策略 · 操作与工具审计</text>
<rect x="35" y="202" width="238" height="162" rx="14" class="n"/><text x="55" y="237" class="h">01 资产与接入</text><text x="55" y="267" class="b">责任归属 / 环境 / 实例 UUID</text><text x="55" y="292" class="b">只读连接测试 / 能力检查</text><text x="55" y="317" class="b">向导预览 / 启用 / 停采</text><text x="55" y="343" class="s">新增数据库不改源码、不重启</text>
<rect x="305" y="202" width="238" height="162" rx="14" class="n"/><text x="325" y="237" class="h">02 持续多源采集</text><text x="325" y="267" class="b">指标 / SQL 摘要 / 锁 / 会话</text><text x="325" y="292" class="b">元数据 / 配置 / 复制 / 日志</text><text x="325" y="317" class="b">超时 / 退避 / 覆盖率 / 新鲜度</text><text x="325" y="343" class="s">每实例独立；采集失败不等于健康</text>
<rect x="575" y="202" width="238" height="162" rx="14" class="n"/><text x="595" y="237" class="h">03 规则与事件</text><text x="595" y="267" class="b">版本化规则 / 阈值与持续时间</text><text x="595" y="292" class="b">重复抑制 / 告警归并 / 影响</text><text x="595" y="317" class="b">确认 / 分派 / 备注 / 时间线</text><text x="595" y="343" class="s">告警事实由稳定规则产生</text>
<rect x="845" y="202" width="238" height="162" rx="14" class="n"/><text x="865" y="237" class="h">04 AI 证据调查</text><text x="865" y="267" class="b">授权资产 + 绝对时间窗</text><text x="865" y="292" class="b">关联指标 / 日志 / SQL / 配置</text><text x="865" y="317" class="b">只读工具补证 / 来源引用</text><text x="865" y="343" class="s">展示反证与未知；不持有写权限</text>
<path d="M273 283H301M543 283H571M813 283H841" class="a"/>
<rect x="845" y="416" width="238" height="156" rx="14" class="n"/><text x="865" y="451" class="h">05 处置与复验</text><text x="865" y="481" class="b">人工选择 / 风险与执行记录</text><text x="865" y="506" class="b">处置前后同口径证据比较</text><text x="865" y="531" class="b">未恢复可重新开启事件</text><text x="865" y="553" class="s">P0人工执行，平台记录与采集复验</text>
<rect x="575" y="416" width="238" height="156" rx="14" class="n"/><text x="595" y="451" class="h">06 知识留存</text><text x="595" y="481" class="b">审核后的事件结论与手册</text><text x="595" y="506" class="b">适用条件 / 反例 / 版本</text><text x="595" y="531" class="b">后续调查检索并引用来源</text><text x="595" y="553" class="s">模型原始回答不自动成为知识</text>
<path d="M964 364V412M845 494H817" class="a"/><path d="M575 494H424V368" class="a"/>
<rect x="35" y="416" width="508" height="156" rx="14" fill="#e7f0f8" stroke="#c4d4e5"/><text x="55" y="451" class="h">面向工作的查询与展示</text><text x="55" y="481" class="b">范围化总览 · 资产拓扑 · 实例详情 · 历史检索</text><text x="55" y="506" class="b">SQL 与锁关系 · 事件工作台 · AI 调查 · 采集任务</text><text x="55" y="531" class="b">每次计数 / 搜索 / 图表 / 导出 / 工具都在后端授权</text><text x="55" y="553" class="s">DBA看详细证据；开发看所属系统；查看者看范围内摘要</text>
<rect x="1115" y="202" width="210" height="370" rx="14" fill="#fff4df" stroke="#e6d0a0"/><text x="1135" y="237" class="h">验收必须可核实</text><text x="1135" y="274" class="b">接入未知新实例</text><text x="1135" y="308" class="b">多实例连续采集</text><text x="1135" y="342" class="b">跨部门越权被拒绝</text><text x="1135" y="376" class="b">历史时间窗可追溯</text><text x="1135" y="410" class="b">真实故障完整闭环</text><text x="1135" y="444" class="b">模型失败不阻断监控</text><text x="1135" y="478" class="b">重启后状态恢复</text><text x="1135" y="524" class="s">没有实测证据不标“完成”</text>
<text x="35" y="622" class="h">首批完整 MySQL 链路</text><text x="35" y="650" class="b">PostgreSQL、企业 SSO、高可用和更多采集适配器列为扩展；备份恢复是附属模块。</text>
</svg>
