<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="810" viewBox="0 0 1360 810" role="img" aria-labelledby="title desc">
<title id="title">内部 AI 数据库运维平台容器架构设计</title><desc id="desc">React界面通过统一授权API访问资产、时序和证据，独立采集worker读MySQL，独立AI worker使用受授权只读工具，Prometheus存数值，MySQL存控制数据与结构化证据。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#368d85"/></marker><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#173b3b}.h{font-size:18px;font-weight:700}.b{font-size:14px;fill:#49676a}.a{fill:none;stroke:#368d85;stroke-width:2;marker-end:url(#arrow)}.n{fill:#fff;stroke:#b7d2ce;stroke-width:1.5}.boundary{fill:#f6faf9;stroke:#8bb4ac;stroke-width:1.5;stroke-dasharray:7 5}</style></defs>
<rect width="1360" height="810" rx="20" fill="#eef5f3"/><text x="30" y="38" class="h">架构设计：模块化 API + 独立任务进程 + 专用数据存储</text><text x="30" y="65" class="b">组件及接口是设计决定，安装版本和运行能力在实施阶段验证。箭头标明访问方向。</text>
<rect x="30" y="90" width="1300" height="600" rx="16" class="boundary"/><text x="50" y="118" class="b">平台部署边界 · 首批本机 / 单节点部署，服务端统一处理权限</text>
<rect x="55" y="148" width="215" height="118" rx="12" class="n"/><text x="74" y="180" class="h">React / TypeScript</text><text x="74" y="209" class="b">工作台 / 接入 / 事件 / AI</text><text x="74" y="236" class="b">用户会话，不持有数据库密钥</text>
<rect x="315" y="148" width="440" height="118" rx="12" fill="#dff1ec" stroke="#8dbbad"/><text x="335" y="180" class="h">FastAPI /api/v1 · 授权与查询入口</text><text x="335" y="209" class="b">会话 / 角色 + 数据范围 / 凭据保管 / 审计</text><text x="335" y="236" class="b">资产 · 指标模板 · 证据检索 · 事件 · 调查 · 任务</text>
<path d="M270 205H311" class="a"/><text x="280" y="188" class="b">HTTP</text>
<rect x="805" y="148" width="235" height="118" rx="12" class="n"/><text x="825" y="180" class="h">MySQL 8 控制 / 证据库</text><text x="825" y="209" class="b">资产 / 用户 / 授权 / 持久任务</text><text x="825" y="236" class="b">日志 / 快照 / 事件 / 调查 / 审计</text><path d="M755 205H801" class="a"/>
<rect x="1080" y="148" width="225" height="118" rx="12" class="n"/><text x="1100" y="180" class="h">独立私密存储</text><text x="1100" y="209" class="b">Fernet 密文 / 外置 master key</text><text x="1100" y="236" class="b">不进 Git、导出、模型上下文</text>
<rect x="315" y="334" width="300" height="145" rx="12" class="n"/><text x="335" y="366" class="h">采集 / 规则 worker</text><text x="335" y="395" class="b">实例租约 / 并发限制 / 失败退避</text><text x="335" y="420" class="b">MySQL 适配器 / 能力检测 / 版本化规则</text><text x="335" y="452" class="b">持续采集不等待模型响应</text>
<rect x="660" y="334" width="300" height="145" rx="12" class="n"/><text x="680" y="366" class="h">AI 调查 worker</text><text x="680" y="395" class="b">任务 / 授权资产 + 时间窗 / 脱敏</text><text x="680" y="420" class="b">证据包 / 只读工具网关 / 调用预算</text><text x="680" y="452" class="b">报告 / 引用 / 反证 / 人工反馈</text>
<text x="335" y="304" class="b">API 将任务写入控制库，worker 按队列领取</text><path d="M615 365H640V288H900V270" class="a"/><path d="M960 365H985V280H950V270" class="a"/><text x="1010" y="302" class="b">任务 / 租约 / 证据 / 结果</text>
<rect x="55" y="334" width="215" height="145" rx="12" class="n"/><text x="75" y="366" class="h">Prometheus</text><text x="75" y="395" class="b">数值时序 / 保留策略</text><text x="75" y="420" class="b">仅后台接口，可查模板指标</text><text x="75" y="452" class="b">不存 SQL / 日志 / 敏感标签</text><path d="M315 240H292V405H274" class="a"/>
<rect x="55" y="542" width="215" height="105" rx="12" class="n"/><text x="75" y="575" class="h">metrics bridge</text><text x="75" y="602" class="b">已采样指标 / 采集新鲜度</text><text x="75" y="627" class="b">失败或过期不冒充新样本</text><path d="M160 479V538M315 445H292V593H274" class="a"/>
<rect x="315" y="542" width="645" height="105" rx="12" fill="#e7f0f8" stroke="#b3cce1"/><text x="335" y="575" class="h">采集进程专用连接适配器</text><text x="335" y="602" class="b">直连 TLS 或已核验 SSH 隧道 · 只读数据库账号 · 日志表 / 可选文件通道</text><text x="335" y="627" class="b">AI 只读既有授权证据，不直接连目标库；PostgreSQL 后续实现适配契约</text><path d="M465 479V538" class="a"/>
<rect x="1010" y="334" width="295" height="145" rx="12" fill="#fff4df" stroke="#dcc28f"/><text x="1030" y="366" class="h">外部模型服务（DeepSeek）</text><text x="1030" y="395" class="b">每资产 AI 数据策略默认关闭</text><text x="1030" y="420" class="b">显式允许后发送脱敏证据包</text><text x="1030" y="452" class="b">无密钥、无写权限、无扩大资源权限</text><path d="M960 405H1006" class="a"/>
<rect x="1010" y="542" width="295" height="105" rx="12" class="n"/><text x="1030" y="575" class="h">Grafana / 官方 exporter</text><text x="1030" y="602" class="b">可选管理员适配，不承担业务数据隔离</text><text x="1030" y="627" class="b">存在可达端点时才启用，不伪称已接入</text>
<rect x="315" y="725" width="645" height="60" rx="12" fill="#fff" stroke="#9cb8ad"/><text x="335" y="750" class="h">受管 MySQL 实例 A / B / 新增实例</text><text x="335" y="772" class="b">实例归属一个业务系统；schemas 是资产信息，不冒充跨部门隔离边界</text><path d="M630 647V721" class="a"/>
<text x="45" y="740" class="b">API / 采集 / AI 分进程</text><text x="45" y="766" class="b">单实例故障和模型超时彼此隔离</text>
</svg>
