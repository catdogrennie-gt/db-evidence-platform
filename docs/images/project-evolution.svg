<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img" aria-labelledby="title desc">
<title id="title">项目如何演化</title>
<desc id="desc">三次方案选择：减少重复采集，同时保留问题分析能力。</desc>
<defs>
<marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 8 4.5 L 0 9 Z" fill="#2563eb"/></marker>
<marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 8 4.5 L 0 9 Z" fill="#0f766e"/></marker>
<marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 8 4.5 L 0 9 Z" fill="#a45b13"/></marker>
</defs>
<g font-family="Microsoft YaHei UI, Microsoft YaHei, Noto Sans CJK SC, PingFang SC, system-ui, sans-serif">
<rect x="0" y="0" width="1280" height="790" rx="0" fill="#f5f8fc" stroke="none"/>
<text x="48" y="57" font-size="29" fill="#14263f" font-weight="700" text-anchor="start">项目如何演化</text>
<text x="48" y="88" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">三次方案选择：减少重复采集，同时保留问题分析能力。</text>
<rect x="1032" y="32" width="200" height="36" rx="18" fill="#e7efff" stroke="none"/>
<text x="1132" y="56" font-size="16" fill="#2563eb" font-weight="600" text-anchor="middle">需求与方案取舍</text>
<path d="M 48 112 H 1232" fill="none" stroke="#d5dfec" stroke-width="1"/>
<path d="M 408 156 H 455" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#blue)"/>
<rect x="349.0" y="125" width="166" height="25" rx="5" fill="#f5f8fc" stroke="none"/>
<text x="432" y="143" font-size="16" fill="#2563eb" font-weight="400" text-anchor="middle">复用采集与展示</text>
<path d="M 824 156 H 871" fill="none" stroke="#0f766e" stroke-width="2.3" marker-end="url(#teal)"/>
<rect x="765.0" y="125" width="166" height="25" rx="5" fill="#f5f8fc" stroke="none"/>
<text x="848" y="143" font-size="16" fill="#0f766e" font-weight="400" text-anchor="middle">保留分析深度</text>
<rect x="48" y="178" width="352" height="480" rx="16" fill="white" stroke="#bcd2f5"/>
<rect x="70" y="200" width="45" height="31" rx="9" fill="#e8f0ff" stroke="none"/>
<text x="92.5" y="222" font-size="17" fill="#2563eb" font-weight="700" text-anchor="middle">01</text>
<text x="72" y="271" font-size="25" fill="#14263f" font-weight="700" text-anchor="start">自建运维平台</text>
<text x="72" y="302" font-size="16" fill="#2563eb" font-weight="400" text-anchor="start">先验证采集、分析与权限闭环</text>
<text x="72" y="351" font-size="17" fill="#2563eb" font-weight="700" text-anchor="start">阶段目标</text>
<text x="72" y="381" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">直接采集数据库与主机状态</text>
<text x="72" y="408" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">形成权限、事件与分析闭环</text>
<text x="72" y="460" font-size="17" fill="#2563eb" font-weight="700" text-anchor="start">遇到的问题</text>
<text x="72" y="490" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">接入与自建采集配置较重</text>
<text x="72" y="517" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">界面信息多，分析结论不直观</text>
<text x="72" y="578" font-size="17" fill="#2563eb" font-weight="700" text-anchor="start">保留下来</text>
<text x="72" y="609" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">权限、调查、证据与报告主干</text>
<rect x="464" y="178" width="352" height="480" rx="16" fill="white" stroke="#bcd2f5"/>
<rect x="486" y="200" width="45" height="31" rx="9" fill="#e8f0ff" stroke="none"/>
<text x="508.5" y="222" font-size="17" fill="#2563eb" font-weight="700" text-anchor="middle">02</text>
<text x="488" y="271" font-size="25" fill="#14263f" font-weight="700" text-anchor="start">Grafana 插件探索</text>
<text x="488" y="302" font-size="16" fill="#2563eb" font-weight="400" text-anchor="start">尝试复用成熟监控与看板</text>
<text x="488" y="351" font-size="17" fill="#2563eb" font-weight="700" text-anchor="start">阶段目标</text>
<text x="488" y="381" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">复用 Zabbix 数据和 Grafana 图表</text>
<text x="488" y="408" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">将诊断工作整合到一个入口</text>
<text x="488" y="460" font-size="17" fill="#2563eb" font-weight="700" text-anchor="start">遇到的问题</text>
<text x="488" y="490" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">本次实现偏手动查看与分析</text>
<text x="488" y="517" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">展示复用后，结论深度仍不足</text>
<text x="488" y="578" font-size="17" fill="#2563eb" font-weight="700" text-anchor="start">保留下来</text>
<text x="488" y="609" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">数据接入思路、可视化与实验</text>
<rect x="880" y="178" width="352" height="480" rx="16" fill="white" stroke="#9fccc5"/>
<rect x="902" y="200" width="45" height="31" rx="9" fill="#e2f3ef" stroke="none"/>
<text x="924.5" y="222" font-size="17" fill="#0f766e" font-weight="700" text-anchor="middle">03</text>
<text x="904" y="271" font-size="25" fill="#14263f" font-weight="700" text-anchor="start">Zabbix + 原平台</text>
<text x="904" y="302" font-size="16" fill="#0f766e" font-weight="400" text-anchor="start">采集做减法，分析与报告保留</text>
<text x="904" y="351" font-size="17" fill="#0f766e" font-weight="700" text-anchor="start">阶段目标</text>
<text x="904" y="381" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">Zabbix 统一采集，按项聚合</text>
<text x="904" y="408" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">原平台持续发现并联合分析</text>
<text x="904" y="460" font-size="17" fill="#0f766e" font-weight="700" text-anchor="start">当前取舍</text>
<text x="904" y="490" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">选监控项，不重复配置采集</text>
<text x="904" y="517" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">结论在前，证据与图表按需看</text>
<text x="904" y="578" font-size="17" fill="#0f766e" font-weight="700" text-anchor="start">保留下来</text>
<text x="904" y="609" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">业务权限、巡检与可追溯报告</text>
<rect x="48" y="683" width="1184" height="51" rx="12" fill="#e8f3f0" stroke="#c2ded6"/>
<text x="72" y="716" font-size="19" fill="#0f766e" font-weight="600" text-anchor="start">最终方向：让成熟工具负责采集，让平台把分散线索整理成结论、建议与可核对的证据。</text>
<text x="48" y="760" font-size="16" fill="#52647b" font-weight="400" text-anchor="start">这里记录本项目的实现取舍；不表示 Grafana 的插件能力只能做到这些。</text>
</g>
</svg>
