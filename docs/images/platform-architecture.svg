<text x="48" y="1022" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">Zabbix 保留上游历史；平台只保存分析所需采样与证据。</text>
<text x="48" y="1050" font-size="17" fill="#52647b" font-weight="400" text-anchor="start">浏览器与模型均不直连业务数据库；AI 不执行 SQL、Shell 或数据库变更。</text>
<text x="48" y="1080" font-size="16" fill="#52647b" font-weight="400" text-anchor="start">蓝线：取数与访问    青线：调查与证据    虚线：可选模型调用；两类 worker 的队列独立。</text>
